<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScripticX · Account</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: Canvas;
        color: CanvasText;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      p {
        color: color-mix(in srgb, CanvasText 65%, transparent);
        font-size: 14px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <p id="status">Finishing secure sign-in…</p>
    <script>
      (() => {
        const status = document.getElementById("status");
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const query = new URLSearchParams(window.location.search);
        const error =
          fragment.get("error_description") ||
          fragment.get("error") ||
          query.get("error_description") ||
          query.get("error");
        const accessToken = fragment.get("access_token");
        const refreshToken = fragment.get("refresh_token");

        const payload = {
          type: "scripticx:add-account-oauth",
          accessToken,
          refreshToken,
          error,
        };

        if (window.opener) {
          window.opener.postMessage(payload, window.location.origin);
        }
        if (typeof BroadcastChannel !== "undefined") {
          const channel = new BroadcastChannel("scripticx:add-account-oauth");
          channel.postMessage(payload);
          window.setTimeout(() => channel.close(), 250);
        }

        if (!window.opener && typeof BroadcastChannel === "undefined") {
          status.textContent = "Return to ScripticX and try again.";
          return;
        }

        status.textContent = error
          ? "Sign-in could not be completed."
          : "Account connected. You can close this window.";
        window.setTimeout(() => window.close(), 120);
      })();
    </script>
  </body>
</html>
